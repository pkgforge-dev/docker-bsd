# Build the images that BOOT a BSD, prove they boot, time them, publish them.
#
# ⭐ THE PROOF IS THE POINT AND IT RUNS HERE. ci.yml says a runner has no BSD
# kernel and refuses to pretend otherwise, and that is still true: this job
# does not run a BSD image on the runner's kernel. It runs a LINUX image which
# happens to contain an emulator, and the BSD inside it is a guest. That is why
# this is the one workflow in this repository that can assert on a BSD.
#
# ⛔ THE ASSERTIONS, AND THE SECOND EXISTS BECAUSE THE FIRST ALONE IS THEATRE:
#
#   1. the guest answers, and names a BSD;
#   2. ⭐ A COMMAND THAT FAILS IN THE GUEST MAKES THE CONTAINER FAIL. A guard
#      never seen to fail is a guard nobody has tested, so this run plants the
#      defect: it asks the guest to exit 3 and requires exactly 3 back. Without
#      it, an entrypoint that always exited 0 would pass assertion 1 forever;
#   3. it needs no network at run time, which is what "baked into layers"
#      means and the difference between this and the experiment it came from;
#   4. ⭐ for the build variant only, that the userland is REAL: the rescue one
#      has no `uname` at all, so a `uname` that answers is not a formality.
#
# ⚠ THE TIMINGS ARE TAKEN HERE AND NOWHERE ELSE. RULES.md decision 2: the
# baseline is a free runner, not the developer's laptop. The numbers this job
# prints are the ones docs/LIMITS.md is allowed to carry.
#
# ⛔ Third-party actions are pinned to a COMMIT, not a tag.

name: image-netbsd

on:
  push:
    branches: [main]
    paths:
      - images/netbsd/**
      - experiments/lib/console.py
      - scripts/time-image
      - scripts/build-netbsd
      - scripts/sources
      - .github/workflows/image-netbsd.yml
  pull_request:
    paths:
      - images/netbsd/**
      - experiments/lib/console.py
      - scripts/time-image
      - scripts/build-netbsd
      - scripts/sources
      - .github/workflows/image-netbsd.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Push to ghcr.io as well as building and proving
        type: boolean
        default: false
  schedule:
    # ⚠ Weekly. Both guest artefacts sit behind moving pointers, so this is
    # also the alarm for one of them being rotated: the digest check fails the
    # build rather than shipping a different guest under the same tag.
    - cron: "0 5 * * 1"

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: image-netbsd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  netbsd:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    # ⚠ GENEROUS ON PURPOSE, AND MEASURED RATHER THAN GUESSED. The build
    # variant installs a compiler by booting the guest and unpacking half a
    # gigabyte inside it, unaccelerated, because a build has no usable
    # /dev/kvm. ⛔ It is not disk bound: the guest writes 100 MB in 2.5
    # seconds. It is the unpacking itself, which is tens of thousands of small
    # files and is exactly the shape emulation is worst at.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      # ⛔ NOT fail-fast. Which variant broke is the information this run
      # exists to produce, and the fast one failing says something different
      # from the large one failing.
      fail-fast: false
      matrix:
        include:
          - variant: rescue
            tag: latest
          - variant: build
            tag: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ⚠ Which engine, decided once and used for every step. podman and docker
      # do not share an image store, so a build under one and a push under the
      # other pushes nothing and reports success.
      - name: The engine, and what this runner actually offers
        run: |
          if command -v podman >/dev/null 2>&1; then echo "ENGINE=podman" >> "$GITHUB_ENV"
          else echo "ENGINE=docker" >> "$GITHUB_ENV"; fi
          echo "runner: $(uname -srm)"
          echo "nproc:  $(nproc)"
          if [ -c /dev/kvm ]; then
            echo "kvm:    present, $(ls -l /dev/kvm)"
            echo "HAVE_KVM=1" >> "$GITHUB_ENV"
          else
            echo "kvm:    ABSENT on this runner"
            echo "HAVE_KVM=0" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: sh scripts/build-netbsd --variant "${{ matrix.variant }}" --tag ci

      # ── assertion 1: it boots, unaccelerated, with no device handed in ─────
      #
      # ⛔ NOTE WHAT IS NOT PASSED. No --privileged, no --cap-add, no --device.
      # This is the claim the whole entry rests on, so the run that proves it
      # must not quietly be given anything.
      - name: A BSD answers, with no privilege and no device
        run: sh scripts/build-netbsd --variant "${{ matrix.variant }}" --tag ci --test-only

      # ── assertion 2: the guard is seen to fail ────────────────────────────
      - name: A command that fails in the guest fails the container
        run: |
          rc=0
          "$ENGINE" run --rm -i localhost/netbsd:ci sh -c 'exit 3' >/dev/null 2>&1 || rc=$?
          echo "the guest was asked to exit 3 and the container exited $rc"
          if [ "$rc" != "3" ]; then
            echo "FAIL: the guest's exit status does not reach the caller"
            exit 1
          fi

      # ── assertion 3: nothing is fetched at run time ───────────────────────
      - name: It boots with no network at all
        run: |
          rc=0
          out=$("$ENGINE" run --rm -i --network none localhost/netbsd:ci \
                sh -c 'sysctl -n kern.osrelease' 2>/dev/null) || rc=$?
          echo "exit $rc, stdout: $out"
          if [ "$rc" != "0" ] || [ -z "$out" ]; then
            echo "FAIL: the image needs a network at run time"
            exit 1
          fi

      # ── assertion 4: the build variant carries a real userland ────────────
      #
      # ⛔ `uname` IS THE DISCRIMINATING TEST AND NOT A FORMALITY. The rescue
      # userland does not have it. An assertion that both variants could pass
      # would not be an assertion about this one.
      - name: A real userland, with a package manager
        if: matrix.variant == 'build'
        run: |
          rc=0
          out=$("$ENGINE" run --rm -i localhost/netbsd:ci \
                sh -c 'uname -sr; command -v pkg_add; command -v pkgin' 2>/dev/null) || rc=$?
          echo "exit $rc"
          echo "$out"
          case "$out" in
            *pkg_add*) : ;;
            *) echo "FAIL: no package manager in the build userland"; exit 1 ;;
          esac
          if [ "$rc" != "0" ]; then echo "FAIL: exit $rc"; exit 1; fi

      # ── the timings, which are the numbers docs/LIMITS.md may carry ───────
      - name: Time it, unaccelerated
        run: |
          sh scripts/time-image --image localhost/netbsd:ci --runs 5

      - name: Time it with /dev/kvm
        if: env.HAVE_KVM == '1'
        run: |
          sh scripts/time-image --image localhost/netbsd:ci --runs 5 --kvm

      # ⛔ WHY THE DEVICE DID NOT HELP, READ RATHER THAN GUESSED. The step above
      # hands in /dev/kvm and the image still reports accel=tcg, which means the
      # node reached the container and could not be opened. This prints what the
      # container actually sees, so the explanation is a reading and not a
      # story. ⚠ It does not fail the build: it is a fact about the runner.
      - name: What the container sees of /dev/kvm
        if: env.HAVE_KVM == '1'
        continue-on-error: true
        run: |
          echo "== the runner's own view =="
          id
          ls -l /dev/kvm
          echo "== inside the container, device handed in =="
          "$ENGINE" run --rm -i --device /dev/kvm --entrypoint sh localhost/netbsd:ci \
            -c 'id; ls -l /dev/kvm; if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "openable: yes"; else echo "openable: NO"; fi'
          echo "== the same, with the group kept =="
          "$ENGINE" run --rm -i --device /dev/kvm --group-add keep-groups --entrypoint sh localhost/netbsd:ci \
            -c 'id; if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "openable: yes"; else echo "openable: NO"; fi' \
            || echo "the engine refused --group-add keep-groups"

      - name: Time it with /dev/kvm and the group kept
        if: env.HAVE_KVM == '1'
        continue-on-error: true
        run: |
          ENGINE_EXTRA="--group-add keep-groups" sh scripts/time-image \
            --image localhost/netbsd:ci --runs 5 --kvm

      - name: What is in it, and what it cost
        run: |
          "$ENGINE" run --rm -i --entrypoint cat localhost/netbsd:ci /opt/bsd/evidence.txt
          "$ENGINE" image inspect localhost/netbsd:ci --format '{{.Size}}' \
            | awk '{ printf "image size: %.0f MB\n", $1/1000000 }'

      # ── publish ───────────────────────────────────────────────────────────
      #
      # ⛔ Only on an explicit dispatch that asked for it. A push to main
      # builds and proves; it does not publish, because a green build is not
      # the same decision as a release.
      - name: Log in to ghcr.io
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | "$ENGINE" login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          reg="ghcr.io/${{ github.repository_owner }}"
          "$ENGINE" tag localhost/netbsd:ci "$reg/netbsd:${{ matrix.tag }}"
          "$ENGINE" tag localhost/netbsd:ci "$reg/netbsd:${{ matrix.variant }}-${GITHUB_SHA::12}"
          "$ENGINE" push "$reg/netbsd:${{ matrix.tag }}"
          "$ENGINE" push "$reg/netbsd:${{ matrix.variant }}-${GITHUB_SHA::12}"
          echo "published $reg/netbsd:${{ matrix.tag }}"
